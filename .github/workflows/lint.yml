name: Lint and Validate

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pylint black isort
    
    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 custom_components/i9_schedule --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 custom_components/i9_schedule --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Check code style with Black
      run: black custom_components/i9_schedule --check --line-length=127 || true
    
    - name: Check import sorting with isort
      run: isort custom_components/i9_schedule --check-only || true

  validate_manifest:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Validate manifest.json
      run: |
        python -c "import json; json.load(open('custom_components/i9_schedule/manifest.json'))" || exit 1
        echo "manifest.json is valid"
    
    - name: Validate strings.json
      run: |
        python -c "import json; json.load(open('custom_components/i9_schedule/strings.json'))" || exit 1
        echo "strings.json is valid"
    
    - name: Validate services.yaml
      run: |
        python -c "import yaml; yaml.safe_load(open('custom_components/i9_schedule/services.yaml'))" || exit 1
        echo "services.yaml is valid"
