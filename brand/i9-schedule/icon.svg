<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Background -->
  <rect width="256" height="256" fill="#1a1a2e" rx="12"/>
  
  <!-- Football -->
  <g id="football" transform="translate(128, 128)">
    <!-- Main football body (brown leather) -->
    <ellipse cx="0" cy="0" rx="70" ry="45" fill="#8b6f47" stroke="#5c4a2f" stroke-width="2"/>
    
    <!-- Laces (white stitching down center) -->
    <line x1="-60" y1="0" x2="60" y2="0" stroke="#f5f5f5" stroke-width="2"/>
    
    <!-- Lace knots -->
    <circle cx="-45" cy="0" r="2" fill="#f5f5f5"/>
    <circle cx="-25" cy="0" r="2" fill="#f5f5f5"/>
    <circle cx="0" cy="0" r="2" fill="#f5f5f5"/>
    <circle cx="25" cy="0" r="2" fill="#f5f5f5"/>
    <circle cx="45" cy="0" r="2" fill="#f5f5f5"/>
    
    <!-- Shadow underneath -->
    <ellipse cx="0" cy="52" rx="65" ry="10" fill="#000000" opacity="0.15"/>
  </g>
  
  <!-- Schedule icon -->
  <g id="schedule" transform="translate(40, 40)">
    <rect width="35" height="35" fill="#10b981" rx="4" opacity="0.85"/>
    <line x1="5" y1="12" x2="30" y2="12" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="5" y1="19" x2="30" y2="19" stroke="#ffffff" stroke-width="1"/>
    <line x1="5" y1="25" x2="30" y2="25" stroke="#ffffff" stroke-width="1"/>
  </g>
</svg>
